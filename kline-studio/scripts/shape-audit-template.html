<!doctype html><meta charset="utf-8"><title>全部形态逐题核对</title>
<style>
body{margin:0;background:#0e1520;color:#dce5f1;font:16px system-ui}main{max-width:1600px;margin:auto;padding:24px}h1{font-size:25px;margin:0 0 12px}p{line-height:1.65}button,select{background:#24334b;color:white;border:1px solid #52627c;padding:10px;border-radius:6px;font-size:15px}button{cursor:pointer}nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0}select{max-width:750px}canvas{width:100%;height:560px;border:1px solid #39465d;border-radius:8px}article{padding:18px;background:#192332;border:1px solid #3c4b61;border-radius:8px}h2{font-size:20px;overflow-wrap:anywhere}.match{color:#4de0ad}.nonmatch{color:#ff8e8e}.uncertain{color:#ffd479}small{color:#9bacc3;overflow-wrap:anywhere}.legend{display:flex;gap:24px}.legend span:nth-child(1){color:#38bdf8}.legend span:nth-child(2){color:#fb923c}.legend span:nth-child(3){color:#c084fc}table{width:100%;border-collapse:collapse;margin:12px 0}td,th{text-align:left;border-bottom:1px solid #344156;padding:8px;overflow-wrap:anywhere}a{color:#7dcaff}summary{cursor:pointer}#count{font-weight:700}
</style><main>
<h1>全部形态逐题核对</h1><p id="count"></p>
<p>只查看各自原记录K及以前的行情，不读取后续表现。<b>视觉符合不等于已验证“首次可识别震荡”的时间。</b>区间边界是这次对已有前缀的复核解释；原始事件、时间与统计样本全部保留。这里未重新扫描未入库行情。</p>
<nav><label>结果 <select id="filter"><option value="all">全部39条</option><option value="match">视觉符合</option><option value="nonmatch">不符合</option><option value="uncertain">证据不足</option></select></label><button id="prev">上一条</button><select id="case"></select><button id="next">下一条</button><button id="zoom">查看完整前缀</button></nav>
<article><h2 id="heading"></h2><p id="note"></p><p id="evidence"></p><div class="legend"><span>蓝色：窄通道</span><span>橙色：宽通道</span><span>紫色：震荡区间</span></div><p id="bounds"></p></article>
<p id="barinfo">在图上移动鼠标可查看该根K线的实际高低价。</p><canvas id="chart" width="1600" height="560"></canvas><p><small id="provenance"></small></p>
<details><summary>39条核对清单</summary><table><thead><tr><th>记录</th><th>视觉结论</th><th>原题池</th></tr></thead><tbody id="list"></tbody></table></details>
</main><script>
const records=__AUDIT_DATA__;
const labels={match:'视觉符合 · 首次时点未验证',nonmatch:'不符合 · 不作为合格形态出题',uncertain:'证据不足 · 暂不作为合格题'};
const short=r=>r.id.startsWith('M')?r.id:(r.id.includes('week2')?'6月第二周':'7月第一周')+' · 源K'+(r.endIndex+r.sourceOffset);
const el=id=>document.getElementById(id);let filtered=records,full=false,current=null,windowStart=0;
el('count').textContent=`已核对 ${records.length}/${records.length}：视觉符合 ${records.filter(r=>r.verdict==='match').length}，不符合 ${records.filter(r=>r.verdict==='nonmatch').length}，证据不足 ${records.filter(r=>r.verdict==='uncertain').length}。原已排除12条保持排除。`;
function options(){filtered=records.filter(r=>el('filter').value==='all'||r.verdict===el('filter').value);el('case').replaceChildren(...filtered.map(r=>new Option(short(r)+' · '+labels[r.verdict],r.id)));show();}
function show(){current=records.find(r=>r.id===el('case').value);if(!current)return;const r=current;el('heading').className=r.verdict;el('heading').textContent=short(r)+' — '+labels[r.verdict];el('note').textContent=r.note;
el('evidence').textContent=r.pivotEvidence.length?'宽通道代表性高低点（不是每个小波动都单调；可在图上核对）：'+r.pivotEvidence.map(e=>(e.kind==='high'?'高点 ':'低点 ')+e.points.map(p=>`K${p.sourceIndex}=${p.price.toFixed(3)}`).join(' → ')).join('； '):'不补画缺失或有争议的三阶段。原记录仍在此处供审计和统计。';
el('bounds').textContent=r.phases.map(p=>({narrow:'窄通道',wide:'宽通道',range:'震荡区间'}[p.kind])+` K${p.startIndex+r.sourceOffset}—K${p.endIndex+r.sourceOffset}（${p.endIndex-p.startIndex+1}根）`).join('　');
el('provenance').textContent=`记录ID：${r.id}；前缀截止源K${r.endIndex+r.sourceOffset}；前缀SHA256：${r.prefixSha256}；${r.previouslyExcluded?'原已排除，保持排除':'原在公共题池'}。复核图未包含任何记录K之后的行情。`;
draw();}
function draw(){const r=current,c=el('chart'),ctx=c.getContext('2d');ctx.fillStyle='#101620';ctx.fillRect(0,0,1600,560);windowStart=full?0:Math.max(0,(r.phases[0]?.startIndex??r.endIndex-160)-15);const bars=r.bars.slice(windowStart);const min=Math.min(...bars.map(b=>b.low)),max=Math.max(...bars.map(b=>b.high)),pad=(max-min)*.18||1;const x=i=>55+(i-windowStart)*(1460/Math.max(1,bars.length-1)),y=p=>500-(p-min+pad)/(max-min+2*pad)*440;
ctx.font='13px system-ui';for(let k=0;k<=5;k++){let price=min+(max-min)*k/5;ctx.strokeStyle='#253141';ctx.beginPath();ctx.moveTo(45,y(price));ctx.lineTo(1535,y(price));ctx.stroke();ctx.fillStyle='#bdcadd';ctx.fillText(price.toFixed(2),1538,y(price)+4);}
for(let i=windowStart;i<r.bars.length;i++){const b=r.bars[i],bx=x(i),w=Math.max(1,Math.min(10,1100/bars.length));ctx.strokeStyle=ctx.fillStyle=b.close>=b.open?'#e3e8f0':'#3978ff';ctx.beginPath();ctx.moveTo(bx,y(b.high));ctx.lineTo(bx,y(b.low));ctx.stroke();ctx.fillRect(bx-w/2,Math.min(y(b.open),y(b.close)),w,Math.max(1,Math.abs(y(b.open)-y(b.close))));if((i-windowStart)%Math.max(5,Math.ceil(bars.length/16/5)*5)===0){ctx.fillStyle='#aabbd1';ctx.fillText('K'+(i+r.sourceOffset),bx-12,535);}}
ctx.strokeStyle='#facc15';ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(x(r.endIndex),15);ctx.lineTo(x(r.endIndex),510);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#facc15';ctx.fillText('原记录K',x(r.endIndex)-70,22);
for(const p of r.phases){const color={narrow:'#38bdf8',wide:'#fb923c',range:'#c084fc'}[p.kind],name={narrow:'窄通道',wide:'宽通道',range:'震荡区间'}[p.kind];let a=r.bars[p.startIndex].close,b=r.bars[p.endIndex].close;if(p.kind==='range')a=b=(a+b)/2;const sx=x(p.startIndex),sy=y(a),ex=x(p.endIndex),ey=y(b);ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.strokeStyle='#0a111c';ctx.lineWidth=9;ctx.stroke();ctx.strokeStyle=color;ctx.lineWidth=5;ctx.stroke();let ang=Math.atan2(ey-sy,ex-sx);ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex-17*Math.cos(ang-.45),ey-17*Math.sin(ang-.45));ctx.lineTo(ex-17*Math.cos(ang+.45),ey-17*Math.sin(ang+.45));ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.font='bold 19px system-ui';let text=name+' '+(p.endIndex-p.startIndex+1)+'根',tw=ctx.measureText(text).width,tx=(sx+ex)/2-tw/2,ty=(sy+ey)/2-32;ctx.fillStyle='#0d1624';ctx.fillRect(tx-8,ty-22,tw+16,33);ctx.strokeStyle=color;ctx.lineWidth=2;ctx.strokeRect(tx-8,ty-22,tw+16,33);ctx.fillStyle=color;ctx.fillText(text,tx,ty+2);ctx.lineWidth=1;}
}
el('chart').onmousemove=e=>{const rect=e.target.getBoundingClientRect();let px=(e.clientX-rect.left)*1600/rect.width;let i=Math.max(windowStart,Math.min(current.endIndex,Math.round(windowStart+(px-55)/1460*(current.endIndex-windowStart))));const b=current.bars[i];el('barinfo').textContent=`源K${i+current.sourceOffset}（题内索引${i}） · 北京时间 ${new Date(b.time*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'})} · 开${b.open} 高${b.high} 低${b.low} 收${b.close}`;};
el('filter').onchange=options;el('case').onchange=show;el('prev').onclick=()=>{el('case').selectedIndex=(el('case').selectedIndex-1+filtered.length)%filtered.length;show();};el('next').onclick=()=>{el('case').selectedIndex=(el('case').selectedIndex+1)%filtered.length;show();};el('zoom').onclick=()=>{full=!full;el('zoom').textContent=full?'聚焦本次结构':'查看完整前缀';draw();};
for(const r of records){const tr=document.createElement('tr');const td=document.createElement('td'),a=document.createElement('a');a.href='#';a.textContent=short(r);a.onclick=e=>{e.preventDefault();el('filter').value='all';options();el('case').value=r.id;show();window.scrollTo(0,0);};td.append(a);tr.append(td);for(const text of [labels[r.verdict],r.previouslyExcluded?'原已排除':'原在题池']){let t=document.createElement('td');t.textContent=text;tr.append(t);}el('list').append(tr);}
options();el('case').value=records.find(r=>r.id.endsWith('-628-bear')).id;show();
</script>
