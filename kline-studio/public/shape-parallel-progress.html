<!doctype html><meta charset="utf-8"><title>6—7月逐周形态识别进度</title><style>body{background:#101722;color:#e2e8f0;font:16px system-ui;margin:40px auto;padding:24px;max-width:1250px}h1{font-size:28px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:14px;border-bottom:1px solid #334155}th{color:#94a3b8}progress{width:150px;display:block;margin-top:6px}p{line-height:1.8;color:#cbd5e1}.running{color:#38bdf8}.failed{color:#fb7185}.complete{color:#34d399}small{color:#94a3b8}a{color:#38bdf8}</style><h1>6—7月 · 逐周形态识别</h1><p>新增8组：Luna Max / default，独立数据和账本并行运行。6月第二周保持 Astra light，其余为 Luna Max。<br>逐根因果PNG：候选同图复核后才确认；冲突保留原响应，仍未确认则重置冲突方向并继续。不等待EMA，不按后续走势筛选。</p><p id="monitor-check">每15分钟自动检查与修复已启用，正在读取最近检查记录。</p><table><thead><tr><th>日期（北京时间）</th><th>状态</th><th>已完成 / 总根数</th><th>原始事件</th><th>已确认 / 冲突</th><th>预计剩余与依据</th></tr></thead><tbody id="rows"></tbody></table><p id="updated"></p><p>范围按周一至周日；月初、月末不足一周单列。各周从自己的第一根开始，不接入旧题目。ETA按最近最多20根平均耗时×剩余根数计算，并行服务波动会影响估算。失败项没有继续运行。</p><script>
async function update(){const runs=await(await fetch('shape-parallel-runs.json?t='+Date.now(),{cache:'no-store'})).json();const table=document.getElementById('rows');table.replaceChildren();for(const r of runs){let p;try{p=await(await fetch(r.progress_url+'?t='+Date.now(),{cache:'no-store'})).json()}catch{p={status:'unavailable',completed:0}}const tr=document.createElement('tr');const state=({running:'运行中',reviewing:p.review_kind==='observation_conflict'?'同图复核：状态冲突':'同图复核：形态候选',ready:'等待启动',paused:'已暂停',failed:'已停止：'+(String(p.error).includes('timed out')?'请求超时':'校验或执行错误'),complete:'完成'})[p.status]||'无法读取';const remain=Math.max(0,r.total-(p.completed||0));const eta=p.status==='running'&&p.estimate_sample_size>=10?`${(remain*p.recent_seconds_per_bar/3600).toFixed(1)}小时（${remain}根 × ${p.recent_seconds_per_bar.toFixed(1)}秒，最近${p.estimate_sample_size}根）`:p.status==='running'?`等待更多实测样本（当前${p.estimate_sample_size||0}根）`:'—';for(const text of [r.label,state,`${p.completed||0} / ${r.total}`,String(p.events||0),`${p.confirmed_signals??'—'} / ${p.conflicts??'—'}`,eta]){const td=document.createElement('td');td.textContent=text;tr.append(td)}tr.children[1].className=p.status;const bar=document.createElement('progress');bar.max=r.total;bar.value=p.completed||0;tr.children[2].append(bar);table.append(tr)}document.getElementById('updated').textContent='页面刷新：'+new Date().toLocaleString()}
async function monitor(){try{const m=await(await fetch('shape-monitor-status.json?t='+Date.now(),{cache:'no-store'})).json();const needs=m.runs.filter(r=>r.status==='needs_attention').length;document.getElementById('monitor-check').textContent='每15分钟自动检查与修复 · 最近检查 '+new Date(m.checked_at).toLocaleString()+' · '+(m.all_complete?'全部校验完成':needs?'有'+needs+'组需要核查':'已检查全部'+m.runs.length+'组') }catch{}}
update();monitor();setInterval(()=>{update();monitor()},10000);
</script>
