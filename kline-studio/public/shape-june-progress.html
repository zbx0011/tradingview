<!doctype html><meta charset="utf-8"><title>6月逐根形态研究进度</title><style>body{background:#101722;color:#e2e8f0;font:18px system-ui;max-width:950px;margin:50px auto;padding:24px}section{border:1px solid #475569;border-radius:12px;padding:24px;margin:20px 0}progress{width:100%;height:28px}strong{color:#38bdf8}p{line-height:1.8}</style><h1>2026年6月第一周 · XAUUSD 5min</h1><p>Luna Max（gpt-5.6-luna / max）· 普通速度（default）<br>逐根PNG识别：窄通道 → 宽通道 → 首次确认震荡即记录，无EMA门槛。</p><section><h2 id="status">读取中</h2><progress id="bar" max="1380" value="0"></progress><p id="counts"></p><p id="eta"></p><p id="updated"></p></section><p>这是形态事件统计，未进行交易回放，也未导入练习题库。每根包括无形态记录均保留；不按后续走势筛选。ETA是历史速度估算，不是完成时限保证。</p><script>async function update(){try{const p=await(await fetch('shape-june-progress.json?t='+Date.now(),{cache:'no-store'})).json();const scope=await(await fetch('shape-june-scope.json?t='+Date.now(),{cache:'no-store'})).json();if(p.run_directory===scope.run_directory){p.total=scope.end_idx_exclusive;p.estimated_seconds_remaining=p.recent_seconds_per_bar==null?null:Math.max(0,p.total-(p.completed||0))*p.recent_seconds_per_bar;document.getElementById('bar').max=p.total;}document.getElementById('status').textContent=({running:'识别中',paused:'阶段检查完成 / 暂停',failed:'已停止：'+p.error,complete:'识别完成'})[p.status]||p.status;document.getElementById('bar').value=p.completed||0;document.getElementById('counts').textContent=`已锁定 ${p.completed||0} / ${p.total||5964} 根；已记录 ${p.events||0} 次形态事件`;document.getElementById('eta').textContent=p.estimated_seconds_remaining!=null?`估计剩余 ${(p.estimated_seconds_remaining/3600).toFixed(1)} 小时 = 剩余 ${(p.total||5964)-(p.completed||0)} 根 × 最近 ${p.estimate_sample_size} 根平均 ${(p.recent_seconds_per_bar||0).toFixed(1)} 秒/根。样本较少或服务速度变化时误差较大。`:'尚无足够实测耗时，不编造预计时间。';document.getElementById('updated').textContent='更新时间：'+p.updated_at}catch(e){document.getElementById('status').textContent='无法读取进度：'+e.message}}update();setInterval(update,5000)</script>
